<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Qual Universo dos Animes é o seu?</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="quiz-container">
        <div id="home-screen">
            <h1>Em qual Universo dos Animes você viveria?</h1>
            <p>Descubra qual dos 10 maiores animes do mundo combina com sua personalidade!</p>
            <button id="start-btn" class="main-btn">Iniciar Jornada Otaku</button>
        </div>

        <div id="quiz-screen" class="hidden">
            <h2 id="question-text">Carregando pergunta...</h2>
            <div id="options-container"></div>
        </div>

        <div id="result-screen" class="hidden">
            <h2>Seu Destino Foi Selado!</h2>
            <p id="result-text">Você pertence ao universo de...</p>

            <button id="character-quiz-btn" class="main-btn">Descobrir qual PERSONAGEM eu seria neste anime! →</button>
            <button id="restart-btn">Jogar Novamente</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
