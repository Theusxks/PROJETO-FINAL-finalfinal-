<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Qual Personagem Você Seria?</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="quiz-container">
        <div id="char-home-screen">
            <h1>Descubra seu Personagem!</h1>
            <p id="welcome-text">Carregando o universo selecionado...</p>
            <button id="start-char-btn" class="main-btn">Descobrir Personagem</button>
        </div>

        <div id="char-quiz-screen" class="hidden">
            <h2 id="char-question-text">Pergunta...</h2>
            <div id="char-options-container"></div>
        </div>

        <div id="char-result-screen" class="hidden">
            <h2>Seu Personagem é...</h2>
            <p id="char-result-text">Aguardando resultado...</p>

            <button onclick="window.location.href='index.html'" class="main-btn">Voltar ao Início</button>
        </div>
    </div>

    <script src="personagem.js"></script>
</body>
</html>
